name: Diagnostic build log

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  require-diagnostic-build-log:
    name: Require diagnostic build log bundle in PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify real diagnostic bundle is committed in this PR
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          echo "Checking PR diff from ${base_sha} to ${head_sha}"

          mapfile -t new_logd < <(
            git diff --name-only --diff-filter=A "${base_sha}...${head_sha}" -- 'diagnostic/*.logd'
          )

          mapfile -t new_json < <(
            git diff --name-only --diff-filter=A "${base_sha}...${head_sha}" -- 'diagnostic/*.json'
          )

          if [ "${#new_logd[@]}" -eq 0 ]; then
            echo "::error::This PR must commit at least one real diagnostic .logd file under diagnostic/."
            exit 1
          fi

          if [ "${#new_json[@]}" -eq 0 ]; then
            echo "::error::This PR must commit matching diagnostic JSON metadata under diagnostic/."
            exit 1
          fi

          echo "Found new diagnostic .logd file(s):"
          printf ' - %s\n' "${new_logd[@]}"

          echo "Found new diagnostic .json file(s):"
          printf ' - %s\n' "${new_json[@]}"

          valid_logd=0
          for file in "${new_logd[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "::error file=${file}::Diagnostic file path is not a file."
              exit 1
            fi

            if [ ! -s "${file}" ]; then
              echo "::error file=${file}::Diagnostic file is empty."
              exit 1
            fi

            name="$(basename "${file}")"
            if [ "${name}" = "build-00000000.logd" ]; then
              echo "::error file=${file}::diagnostic/build-00000000.logd is the checked-in stub and is not valid PR diagnostic evidence."
              exit 1
            fi

            if [[ ! "${name}" =~ ^build-[0-9a-f]{8}(-part[0-9]{3})?\.logd$ ]]; then
              echo "::error file=${file}::Diagnostic .logd must use the build-<8-hex-commit>.logd naming produced by build.py."
              exit 1
            fi

            commit_id="${name#build-}"
            commit_id="${commit_id%%.logd}"
            commit_id="${commit_id%%-part*}"

            metadata_json="diagnostic/build-${commit_id}.json"
            metadata_legacy="diagnostic/build-${commit_id}-metadata.json"
            if [ ! -f "${metadata_json}" ] && [ ! -f "${metadata_legacy}" ]; then
              echo "::error file=${file}::Missing matching diagnostic metadata: ${metadata_json} or ${metadata_legacy}."
              exit 1
            fi

            valid_logd=$((valid_logd + 1))
          done

          for file in "${new_json[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "::error file=${file}::Diagnostic metadata path is not a file."
              exit 1
            fi

            if [ ! -s "${file}" ]; then
              echo "::error file=${file}::Diagnostic metadata file is empty."
              exit 1
            fi

            name="$(basename "${file}")"
            if [ "${name}" = "build-00000000.json" ] || [ "${name}" = "build-00000000-metadata.json" ]; then
              echo "::error file=${file}::diagnostic/${name} is the checked-in stub metadata and is not valid PR diagnostic evidence."
              exit 1
            fi
          done

          if [ "${valid_logd}" -eq 0 ]; then
            echo "::error::This PR must include at least one non-stub diagnostic .logd artifact."
            exit 1
          fi
